# Railway overrides. Activate with SPRING_PROFILES_ACTIVE=prod,railway
server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      connection-timeout: 20000
      initialization-fail-timeout: 60000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://syncroapp.it,https://www.syncroapp.it}
  auth:
    auto-verify-email: ${AUTH_AUTO_VERIFY_EMAIL:true}
  jwt:
    secret: ${JWT_SECRET:railway-dev-secret-change-me-at-least-32-chars}
    issuer: ${JWT_ISSUER:syncro}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  admin:
    bootstrap-secret: ${ADMIN_BOOTSTRAP_SECRET:railway-admin-bootstrap}
  media:
    storage-dir: ${MEDIA_STORAGE_PATH:/data/media}
    base-url: ${MEDIA_BASE_URL:${APP_API_BASE_URL:http://localhost:8080}/media}
  astrology:
    ephemeris-path: ${SWISS_EPHEMERIS_PATH:/data/ephe}
  brevo:
    api-key: ${BREVO_API_KEY:}
  zyra:
    api-key: ${OPENAI_API_KEY:}
