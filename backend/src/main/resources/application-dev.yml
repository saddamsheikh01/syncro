server:
  port: ${SERVER_PORT:8080}
  tomcat:
    connection-timeout: 600000

# Reduce console noise: Hibernate connection/JTA messages and pool warnings on failed startup
logging:
  level:
    org.hibernate.orm.connections: WARN
    org.hibernate.orm.core: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina.loader: WARN

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA:syncro_dev}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:syncro_dev}
  flyway:
    enabled: true
    schemas: ${POSTGRES_SCHEMA:syncro_dev}
    baseline-on-migrate: true
    baseline-version: 8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
      file-size-threshold: 2KB

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  api:
    base-url: ${APP_API_BASE_URL:http://localhost:${SERVER_PORT:8080}}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:syncro}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  admin:
    bootstrap-secret: ${ADMIN_BOOTSTRAP_SECRET}
  media:
    storage-dir: ${MEDIA_STORAGE_PATH:./media-storage}
    base-url: ${MEDIA_BASE_URL:${APP_API_BASE_URL:http://localhost:${SERVER_PORT:8080}}/media}
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: https://maps.googleapis.com/maps/api
    timeout-seconds: ${GOOGLE_MAPS_TIMEOUT_SECONDS:60}
  viator-fetch-worker:
    fixed-delay-ms: ${VIATOR_FETCH_WORKER_DELAY_MS:5000}
    concurrency: ${VIATOR_FETCH_WORKER_CONCURRENCY:6}
  viator:
    api-key: ${VIATOR_API_KEY:}
    base-url: ${VIATOR_BASE_URL:https://api.sandbox.viator.com/partner}
    accept-version: ${VIATOR_ACCEPT_VERSION:application/json;version=2.0}
    default-language: ${VIATOR_ACCEPT_LANGUAGE:en-US}
    timeout-seconds: ${VIATOR_TIMEOUT_SECONDS:60}
    sync:
      enabled: ${VIATOR_SYNC_ENABLED:false}
      use-search-only: ${VIATOR_SYNC_USE_SEARCH_ONLY:false}
      nearby-enabled: ${VIATOR_SYNC_NEARBY_ENABLED:true}
      nearby-max-destinations: ${VIATOR_SYNC_NEARBY_MAX_DESTINATIONS:6}
      nearby-count-per-destination: ${VIATOR_SYNC_NEARBY_COUNT_PER_DESTINATION:50}
      nearby-max-pages: ${VIATOR_SYNC_NEARBY_MAX_PAGES:5}
      nearby-resync-minutes: ${VIATOR_SYNC_NEARBY_RESYNC_MINUTES:30}
  email:
    jobs:
      # Override via env for testing, e.g. EMAIL_NO_CHAT_REMINDER_CRON="0 */5 * * * ?" (every 5 min)
      no-chat-reminder-cron: ${EMAIL_NO_CHAT_REMINDER_CRON:0 0 10 * * ?}
      weekly-match-digest-cron: ${EMAIL_WEEKLY_MATCH_DIGEST_CRON:0 0 9 ? * MON}
      test-not-completed-cron: ${EMAIL_TEST_NOT_COMPLETED_CRON:0 0 11 * * ?}
      incomplete-profile-cron: ${EMAIL_INCOMPLETE_PROFILE_CRON:0 0 0/3 * * ?}
      saved-event-reminder-cron: ${EMAIL_SAVED_EVENT_REMINDER_CRON:0 0 8 * * ?}
      weekly-events-digest-cron: ${EMAIL_WEEKLY_EVENTS_DIGEST_CRON:0 0 9 ? * TUE}
  brevo:
    api-key: ${BREVO_API_KEY:}
    base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
    timeout-seconds: ${BREVO_TIMEOUT_SECONDS:10}
    sender-email: ${BREVO_SENDER_EMAIL:syncro.community@gmail.com}
    sender-name: ${BREVO_SENDER_NAME:Syncro}
    password-reset-template-id: ${BREVO_PASSWORD_RESET_TEMPLATE_ID:0}
    password-reset-url-base: ${BREVO_PASSWORD_RESET_URL_BASE:http://localhost:3000/reset-password}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    # Optional: per-locale template IDs (e.g. WELCOME.es). Use env BREVO_TEMPLATE_<TYPE>_<LOCALE>. Fallback: key without suffix.
    template-ids:
      WELCOME: ${BREVO_TEMPLATE_WELCOME:0}
      WELCOME.es: ${BREVO_TEMPLATE_WELCOME_ES:0}
      WELCOME.fr: ${BREVO_TEMPLATE_WELCOME_FR:0}
      WELCOME.it: ${BREVO_TEMPLATE_WELCOME_IT:0}
      WELCOME.pt: ${BREVO_TEMPLATE_WELCOME_PT:0}
