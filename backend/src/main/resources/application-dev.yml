spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  api:
    base-url: ${APP_API_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:syncro}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  admin:
    bootstrap-secret: ${ADMIN_BOOTSTRAP_SECRET}
  media:
    storage-dir: ${MEDIA_STORAGE_PATH}
    base-url: ${MEDIA_BASE_URL:${APP_API_BASE_URL:http://localhost:8080}/media}
  zyra:
    provider: ${ZYRA_PROVIDER:OLLAMA}
    base-url: ${ZYRA_BASE_URL:http://localhost:11434}
    model: ${ZYRA_MODEL:deepseek-r1:7b}
    api-key: ${OPENAI_API_KEY:}
    max-history: ${ZYRA_MAX_HISTORY:10}
