      EMAIL_VERIFICATION.es: ${BREVO_TEMPLATE_EMAIL_VERIFICATION_ES:0}
      EMAIL_VERIFICATION.fr: ${BREVO_TEMPLATE_EMAIL_VERIFICATION_FR:0}
      EMAIL_VERIFICATION.it: ${BREVO_TEMPLATE_EMAIL_VERIFICATION_IT:0}
      EMAIL_VERIFICATION.pt: ${BREVO_TEMPLATE_EMAIL_VERIFICATION_PT:0}
      EMAIL_VERIFICATION.sq: ${BREVO_TEMPLATE_EMAIL_VERIFICATION_SQ:0}
