spring:
  application:
    name: backend
  profiles:
    default: dev

app:
  auth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      token-info-url: ${GOOGLE_OAUTH_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
      timeout-seconds: ${GOOGLE_OAUTH_TIMEOUT_SECONDS:5}
  brevo:
    api-key: ${BREVO_API_KEY:}
    base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
    timeout-seconds: ${BREVO_TIMEOUT_SECONDS:10}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:Syncro}
    password-reset-template-id: ${BREVO_PASSWORD_RESET_TEMPLATE_ID:0}
    password-reset-url-base: ${BREVO_PASSWORD_RESET_URL_BASE:https://syncroapp.it/reset-password}
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: https://maps.googleapis.com/maps/api
    timeout-seconds: 30
  viator:
    api-key: ${VIATOR_API_KEY:}
    base-url: ${VIATOR_BASE_URL:https://api.sandbox.viator.com/partner}
    accept-version: ${VIATOR_ACCEPT_VERSION:application/json;version=2.0}
    default-language: ${VIATOR_ACCEPT_LANGUAGE:en-US}
    timeout-seconds: ${VIATOR_TIMEOUT_SECONDS:30}
    max-retries: ${VIATOR_MAX_RETRIES:3}
    retry-backoff-millis: ${VIATOR_RETRY_BACKOFF_MILLIS:1000}
    campaign-value: ${VIATOR_CAMPAIGN_VALUE:}
    target-lander: ${VIATOR_TARGET_LANDER:}
    sync:
      enabled: ${VIATOR_SYNC_ENABLED:false}
      use-search-only: ${VIATOR_SYNC_USE_SEARCH_ONLY:false}
      cron: ${VIATOR_SYNC_CRON:0 */30 * * * *}
      zone: ${VIATOR_SYNC_ZONE:UTC}
      default-count: ${VIATOR_SYNC_DEFAULT_COUNT:100}
      default-max-pages: ${VIATOR_SYNC_DEFAULT_MAX_PAGES:5}
      initial-lookback-hours: ${VIATOR_SYNC_INITIAL_LOOKBACK_HOURS:24}
      nearby-enabled: ${VIATOR_SYNC_NEARBY_ENABLED:true}
      nearby-max-destinations: ${VIATOR_SYNC_NEARBY_MAX_DESTINATIONS:3}
      nearby-count-per-destination: ${VIATOR_SYNC_NEARBY_COUNT_PER_DESTINATION:20}
      nearby-max-pages: ${VIATOR_SYNC_NEARBY_MAX_PAGES:3}
      nearby-resync-minutes: ${VIATOR_SYNC_NEARBY_RESYNC_MINUTES:30}
  zyra:
    timeout-seconds: ${ZYRA_TIMEOUT_SECONDS:600}
    profile-recap-cache-ttl-minutes: ${ZYRA_PROFILE_RECAP_TTL_MINUTES:720}
    place-recap-cache-ttl-minutes: ${ZYRA_PLACE_RECAP_TTL_MINUTES:720}
    chat-recap-cache-ttl-minutes: ${ZYRA_CHAT_RECAP_TTL_MINUTES:15}
    recap-cache-max-entries: ${ZYRA_RECAP_CACHE_MAX_ENTRIES:2000}
