<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Magnifying glass -->
  <circle cx="90" cy="90" r="40" fill="white" stroke="#D5DDEA" stroke-width="4"/>
  <circle cx="90" cy="90" r="32" fill="#F8FAFD" stroke="#E4E9F2" stroke-width="1"/>
  <!-- Handle -->
  <line x1="120" y1="120" x2="155" y2="155" stroke="#D5DDEA" stroke-width="8" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="155" y2="155" stroke="#B0BEC5" stroke-width="5" stroke-linecap="round"/>
  <!-- Globe inside -->
  <circle cx="90" cy="90" r="22" fill="none" stroke="#3B6BDC" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="90" cy="90" rx="10" ry="22" fill="none" stroke="#3B6BDC" stroke-width="1.5" opacity="0.4"/>
  <line x1="68" y1="82" x2="112" y2="82" stroke="#3B6BDC" stroke-width="1" opacity="0.3"/>
  <line x1="68" y1="98" x2="112" y2="98" stroke="#3B6BDC" stroke-width="1" opacity="0.3"/>
  <!-- Sparkles -->
  <g transform="translate(45, 50)" opacity="0.5">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(140, 60)" opacity="0.4">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Question mark -->
  <text x="90" y="97" text-anchor="middle" font-size="22" font-weight="700" fill="#3B6BDC" opacity="0.6">?</text>
</svg>
