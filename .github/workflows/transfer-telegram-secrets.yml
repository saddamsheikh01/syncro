name: Transfer Telegram secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transfer-telegram-secrets
  cancel-in-progress: false

jobs:
  transfer:
    name: Copy secrets to AWS repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transfer encrypted repository secrets
        env:
          GH_TOKEN: ${{ secrets.AWS_REPO_SECRET_TRANSFER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          test -n "${TELEGRAM_BOT_TOKEN}"
          test -n "${TELEGRAM_CHAT_ID}"
          printf '%s' "${TELEGRAM_BOT_TOKEN}" \
            | gh secret set TELEGRAM_BOT_TOKEN --repo ricciviero/aws-personale
          printf '%s' "${TELEGRAM_CHAT_ID}" \
            | gh secret set TELEGRAM_CHAT_ID --repo ricciviero/aws-personale
