# Connect this GitHub repo in Railway. Leave Root Directory empty.
# Then add a PostgreSQL plugin and generate a public domain.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "railway.toml", ".dockerignore"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1
